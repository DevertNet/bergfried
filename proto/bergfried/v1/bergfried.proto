syntax = "proto3";

package bergfried.v1;

option go_package = "github.com/DevertNet/bergfried/proto/gen/bergfried/v1;bergfriedv1";

// SandboxAPI: VM -> daemon. The sandbox is derived from the socket, never from a field.
// The worktree name is in the gRPC metadata "x-bergfried-worktree".
service SandboxAPI {
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc SearchFiles(SearchFilesRequest) returns (SearchFilesResponse);
  // Blocks until the user has decided (or the request expires).
  rpc RequestFile(AccessRequest) returns (AccessResult);
  rpc RequestFolder(AccessRequest) returns (AccessResult);
  // Request an SSH grant; blocks until decided.
  rpc RequestSSH(SSHAccessRequest) returns (SSHAccessResult);
  // Report of an SSH attempt from the VM (ssh hook): creates – without blocking – a request in the app.
  rpc SSHAttempt(SSHAttemptRequest) returns (SSHAttemptResult);

  // GitHub access (token per sandbox, lives in the VM): if the token or access to a repo is missing this starts the token flow
  // in the app; blocks until the user has decided.
  rpc RequestGitHubToken(GitHubTokenRequest) returns (GitHubTokenResult);
}

message GitHubTokenRequest {
  string repo = 1;     // owner/name that access is missing for (empty: there is no token at all yet)
  string reason = 2;
}
message GitHubTokenResult {
  Verdict verdict = 1;
  string message = 2;
}

message SSHAttemptRequest {
  string host = 1;
  string port = 2;
  string user = 3;
  bool wait = 4;         // true: blocks until the request is decided (interactive ssh)
}
message SSHAttemptResult {
  string message = 1;
  // ignored | granted (active grant) | pending | cooldown | allowed | denied | aborted
  string state = 2;
}

// Admin: CLI/app -> daemon (local unix socket, 0600).
service Admin {
  rpc ListRequests(ListRequestsRequest) returns (ListRequestsResponse);
  rpc Decide(DecideRequest) returns (DecideResponse);
  rpc DecideSSH(DecideSSHRequest) returns (DecideResponse);
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);
  rpc RevokeGrant(GrantRef) returns (DecideResponse);
  rpc ExtendGrant(ExtendGrantRequest) returns (DecideResponse);
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);
}

message SSHAccessRequest {
  string host = 1;       // host name, optionally with :port
  int32 minutes = 2;     // only a suggestion
  string reason = 3;
  string user = 4;       // user on the target, suggested by the assistant (the user can change it)
}
message SSHAccessResult {
  Verdict verdict = 1;
  string message = 2;
  int64 expires_unix = 3;
  string user = 4;
}
message DecideSSHRequest {
  int64 id = 1;
  bool allow = 2;
  int32 minutes = 3;
  string key_fingerprint = 4;   // SHA256:...
  string user = 5;
  bool all_worktrees = 6;
  bool per_connection = 7;
  bool trust_unknown_host = 8;  // host key was not in known_hosts
}
message Grant {
  int64 id = 1;
  string sandbox = 2;
  string worktree = 3;   // empty = all worktrees of the sandbox
  string host = 4;
  string key_fingerprint = 5;
  string user = 6;
  int64 expires_unix = 7;
  bool per_connection = 8;
  bool revoked = 9;
  repeated string host_key_fingerprints = 10;
}
message ListGrantsRequest { bool only_active = 1; }
message ListGrantsResponse { repeated Grant grants = 1; }
message GrantRef { int64 id = 1; }
message ExtendGrantRequest { int64 id = 1; int32 minutes = 2; }
message KeyInfo { string fingerprint = 1; string comment = 2; string type = 3; }
message ListKeysRequest {}
message ListKeysResponse { repeated KeyInfo keys = 1; string error = 2; }

message FileEntry {
  string path = 1;       // relative to home, separated by "/"
  bool is_dir = 2;
  int64 size = 3;
  int64 mtime_unix = 4;
}

message ListFilesRequest {
  string path = 1;       // relative to home; empty = home
  string pattern = 2;    // optional glob on the name
}
message ListFilesResponse {
  repeated FileEntry entries = 1;
  bool truncated = 2;
}

message SearchFilesRequest { string query = 1; }
message SearchFilesResponse {
  repeated FileEntry entries = 1;
  bool truncated = 2;
}

message AccessRequest {
  string path = 1;       // relative to home
  string reason = 2;     // supplied by the assistant, display as text only
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  VERDICT_ALLOWED = 1;
  VERDICT_DENIED = 2;
  VERDICT_BLOCKED = 3;   // blocklist, refused without asking
  VERDICT_EXPIRED = 4;
}

message AccessResult {
  Verdict verdict = 1;
  string vm_path = 2;    // path in the VM under shared/in/<sandbox>/...
  string message = 3;
}

message Request {
  int64 id = 1;
  string sandbox = 2;
  string worktree = 3;
  string kind = 4;       // file | folder
  string path = 5;
  string reason = 6;
  string status = 7;     // pending | allowed | denied | blocked | expired
  int64 created_unix = 8;
  int64 total_bytes = 9;
  int64 total_files = 10;
}

message ListRequestsRequest { bool only_pending = 1; }
message ListRequestsResponse { repeated Request requests = 1; }

message DecideRequest {
  int64 id = 1;
  bool allow = 2;
  bool confirm_large = 3; // second confirmation for large folders
}
message DecideResponse { string message = 1; }
