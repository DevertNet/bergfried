# Bergfried VM template, version 3 (the daemon remembers the version per sandbox)
# Deliberately NO `template:_default/mounts` -> home is not mounted.
# The two sandbox mounts (shared/in ro, shared/out rw) are set by the daemon via `--mount`.
minimumLimaVersion: 2.0.0

base:
- template:_images/debian-13

vmType: vz
cpus: 4
memory: "6GiB"
disk: "60GiB"

mounts: []
mountType: virtiofs

# No Docker socket to the outside, no agent forwarding: isolation by default.
ssh:
  forwardAgent: false
containerd:
  system: false
  user: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends tmux git curl ca-certificates jq
    if ! command -v docker >/dev/null 2>&1; then
      curl -fsSL https://get.docker.com | sh
    fi
    # Docker for the VM user only, no socket forwarding to the host.
    usermod -aG docker "{{.User}}"
    # SSH only through the broker, without ControlMaster (connections do not outlive a grant).
    mkdir -p /etc/ssh/ssh_config.d
    cat > /etc/ssh/ssh_config.d/50-bergfried.conf <<'CONF'
    Host *
      IdentityAgent /run/user/%i/bergfried-agent.sock
      ControlMaster no
      ControlPath none
      ControlPersist no
    CONF
- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail
    command -v claude >/dev/null 2>&1 && exit 0
    curl -fsSL https://claude.ai/install.sh | bash
    grep -q '.local/bin' ~/.profile || echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.profile
# Daemon socket: /run/user/<uid>/bergfried.sock listens in the VM, connections go to the
# socket of this instance's Mac daemon. The sandbox is derived from the socket path on the Mac.
portForwards:
- guestSocket: "/run/user/{{.UID}}/bergfried.sock"
  hostSocket: "{{.Dir}}/sock/bergfried.sock"
  reverse: true
# SSH broker: ssh-agent socket of the Mac daemon (signs only during a grant).
- guestSocket: "/run/user/{{.UID}}/bergfried-agent.sock"
  hostSocket: "{{.Dir}}/sock/ssh-agent.sock"
  reverse: true
probes:
- script: |
    #!/bin/bash
    set -eux -o pipefail
    timeout 120 bash -c 'until command -v docker >/dev/null && [ -x "$HOME/.local/bin/claude" ]; do sleep 3; done'
  hint: "Siehe /var/log/cloud-init-output.log in der VM"
