# Bergfried-VM-Vorlage, Version 1 (der Daemon merkt sich die Version je Session)
# Bewusst KEIN `template:_default/mounts` -> Home wird nicht gemountet.
# Die zwei Session-Mounts (shared/in ro, shared/out rw) setzt der Daemon per `--mount`.
minimumLimaVersion: 2.0.0

base:
- template:_images/debian-13

vmType: vz
cpus: 4
memory: "6GiB"
disk: "60GiB"

mounts: []
mountType: virtiofs

# Kein Docker-Socket nach außen, kein Agent-Forwarding: Isolation per Default.
ssh:
  forwardAgent: false
containerd:
  system: false
  user: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends tmux git curl ca-certificates jq
    if ! command -v docker >/dev/null 2>&1; then
      curl -fsSL https://get.docker.com | sh
    fi
    # Docker nur für den VM-User, kein Socket-Forwarding zum Host.
    usermod -aG docker "{{.User}}"
- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail
    command -v claude >/dev/null 2>&1 && exit 0
    curl -fsSL https://claude.ai/install.sh | bash
    grep -q '.local/bin' ~/.profile || echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.profile
probes:
- script: |
    #!/bin/bash
    set -eux -o pipefail
    timeout 120 bash -c 'until command -v docker >/dev/null && [ -x "$HOME/.local/bin/claude" ]; do sleep 3; done'
  hint: "Siehe /var/log/cloud-init-output.log in der VM"
