# Bergfried-VM-Vorlage, Version 3 (der Daemon merkt sich die Version je Session)
# Bewusst KEIN `template:_default/mounts` -> Home wird nicht gemountet.
# Die zwei Session-Mounts (shared/in ro, shared/out rw) setzt der Daemon per `--mount`.
minimumLimaVersion: 2.0.0

base:
- template:_images/debian-13

vmType: vz
cpus: 4
memory: "6GiB"
disk: "60GiB"

mounts: []
mountType: virtiofs

# Kein Docker-Socket nach außen, kein Agent-Forwarding: Isolation per Default.
ssh:
  forwardAgent: false
containerd:
  system: false
  user: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    export DEBIAN_FRONTEND=noninteractive
    apt-get update
    apt-get install -y --no-install-recommends tmux git curl ca-certificates jq
    if ! command -v docker >/dev/null 2>&1; then
      curl -fsSL https://get.docker.com | sh
    fi
    # Docker nur für den VM-User, kein Socket-Forwarding zum Host.
    usermod -aG docker "{{.User}}"
    # SSH nur über den Broker, ohne ControlMaster (Verbindungen leben nicht über eine Freigabe hinaus).
    mkdir -p /etc/ssh/ssh_config.d
    cat > /etc/ssh/ssh_config.d/50-bergfried.conf <<'CONF'
    Host *
      IdentityAgent /run/user/%i/bergfried-agent.sock
      ControlMaster no
      ControlPath none
      ControlPersist no
    CONF
- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail
    command -v claude >/dev/null 2>&1 && exit 0
    curl -fsSL https://claude.ai/install.sh | bash
    grep -q '.local/bin' ~/.profile || echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.profile
# Daemon-Socket: in der VM lauscht /run/user/<uid>/bergfried.sock, Verbindungen gehen an den
# Socket des Mac-Daemons dieser Instanz. Die Session ergibt sich aus dem Socket-Pfad auf dem Mac.
portForwards:
- guestSocket: "/run/user/{{.UID}}/bergfried.sock"
  hostSocket: "{{.Dir}}/sock/bergfried.sock"
  reverse: true
# SSH-Broker: ssh-agent-Socket des Mac-Daemons (signiert nur während einer Freigabe).
- guestSocket: "/run/user/{{.UID}}/bergfried-agent.sock"
  hostSocket: "{{.Dir}}/sock/ssh-agent.sock"
  reverse: true
probes:
- script: |
    #!/bin/bash
    set -eux -o pipefail
    timeout 120 bash -c 'until command -v docker >/dev/null && [ -x "$HOME/.local/bin/claude" ]; do sleep 3; done'
  hint: "Siehe /var/log/cloud-init-output.log in der VM"
