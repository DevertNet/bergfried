name: release

# Pushing a tag vX.Y.Z builds the app bundle and publishes a GitHub release.
# The in-app updater installs these releases (see docs/UPDATES.md). Releases are NOT signed.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Gate: create the environment "release" in the repository settings with YOU as required reviewer BEFORE pushing a tag
    # (Settings → Environments → release → Required reviewers). A missing environment is created without protection
    # and the job would run unattended. Approving needs a login (or a token with the "Deployments: write" permission,
    # which sandbox tokens must not have), so an agent that can push a tag cannot ship the release by itself.
    environment: release
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Version from tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "tag must look like vX.Y.Z"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - run: go test ./...
      - name: Build
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-X github.com/DevertNet/bergfried/daemon/internal/api.Version=$VERSION" -o bin/bergfriedd ./daemon/cmd/bergfriedd
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o bin/bergfried-mcp ./mcp/cmd/bergfried-mcp
          app/build.sh
      - name: Package
        run: |
          cd app/build
          ditto -c -k --keepParent Bergfried.app "Bergfried-${VERSION}-macos-arm64.zip"
          shasum -a 256 "Bergfried-${VERSION}-macos-arm64.zip" > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "app/build/Bergfried-${VERSION}-macos-arm64.zip" app/build/SHA256SUMS \
            --title "Bergfried ${VERSION}" --generate-notes
