name: ci

# Tests and a macOS app build on every push to every branch (no release is published here). Pull requests are covered by the
# push run of their branch: a separate pull_request trigger would run the same jobs a second time.
on:
  push:
    branches: ["**"]

permissions:
  contents: read

# A newer push to a work branch makes the older run pointless; dev and main always run to the end (dev-release, release checks).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: App strings (German translations complete and consistent)
        run: python3 scripts/check-strings.py

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # app/build.sh builds the Go helpers (darwin and linux) itself, so they are not built a second time here.
      - name: Build daemon, MCP server and app
        run: app/build.sh
