  <rect x="688" y="370" width="504" height="48" rx="8" fill="#FAFAFC" stroke="#E5E5EA"/>
  <g transform="translate(704,384)" fill="none" stroke="#8E8E93" stroke-width="1.2"><path d="M0 3 a2 2 0 0 1 2 -2 h4 l2 2 h5 a2 2 0 0 1 2 2 v8 a2 2 0 0 1 -2 2 h-11 a2 2 0 0 1 -2 -2 z"/></g>
  <text x="726" y="399" font-family="Inter" font-size="12" font-weight="600" fill="#1D1D1F">docs</text>
  <text x="1172" y="399" font-family="Inter" font-size="13" fill="#8E8E93">›</text>

