  <text x="1127" y="790" font-family="Inter" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Diesen Ordner wählen</text>

  <text x="640" y="884" font-family="Inter" font-size="11" fill="#8E8E93" text-anchor="middle">UI-Konzept – Ordner-Browser mit Breadcrumb, Navigation und „Neuer Ordner“</text>
