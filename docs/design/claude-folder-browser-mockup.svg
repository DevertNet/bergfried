  <text x="106" y="277" font-family="Inter" font-size="12.5" font-weight="600" fill="#1D1D1F">shopware-plugins</text>
  <text x="106" y="293" font-family="Inter" font-size="10" fill="#6E6E73">~/work/shopware-plugins</text>

  <rect x="68" y="313" width="504" height="50" rx="8" fill="#FAFAFC" stroke="#E5E5EA"/>
  <circle cx="88" cy="338" r="7" fill="none" stroke="#C7C7CC" stroke-width="1.2"/>
  <text x="106" y="335" font-family="Inter" font-size="12.5" font-weight="600" fill="#1D1D1F">theme</text>
  <text x="106" y="351" font-family="Inter" font-size="10" fill="#6E6E73">~/work/theme</text>

  <text x="68" y="395" font-family="Inter" font-size="10.5" font-weight="600" fill="#6E6E73">Anderer Ordner</text>
  <rect x="68" y="405" width="374" height="32" rx="6" fill="#FFFFFF" stroke="#DEDEE3"/>
  <text x="80" y="425" font-family="Inter" font-size="11" fill="#A1A1A6">~/work/…</text>
  <rect x="450" y="405" width="122" height="32" rx="6" fill="#007AFF"/>
  <text x="511" y="425" font-family="Inter" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Durchsuchen …</text>
  <text x="68" y="453" font-family="Inter" font-size="9.5" fill="#8E8E93">Öffnet den Ordner-Browser. Dort kannst du auch neue Ordner anlegen.</text>

  <rect x="68" y="475" width="504" height="72" rx="8" fill="#F7F7F9" stroke="#E5E5EA"/>
  <text x="82" y="495" font-family="Inter" font-size="10.5" font-weight="600" fill="#1D1D1F">Was passiert beim Start?</text>
  <text x="82" y="512" font-family="Inter" font-size="10" fill="#6E6E73">Claude wechselt in diesen Ordner und setzt die letzte Sitzung fort, wenn es eine gibt.</text>
  <text x="82" y="526" font-family="Inter" font-size="10" fill="#6E6E73">Es wird kein Git-Worktree und kein neuer Branch angelegt.</text>
  <text x="82" y="540" font-family="Inter" font-size="10" fill="#6E6E73">Der Ordner bleibt beim Entfernen des Claude-Eintrags erhalten.</text>

  <rect x="388" y="770" width="90" height="32" rx="7" fill="#F2F2F5" stroke="#DEDEE3"/>
  <text x="433" y="790" font-family="Inter" font-size="11.5" fill="#3C3C43" text-anchor="middle">Abbrechen</text>
  <rect x="486" y="770" width="86" height="32" rx="7" fill="#007AFF"/>
  <text x="529" y="790" font-family="Inter" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Claude starten</text>

  <!-- arrow -->
  <path d="M604 430 h40" stroke="#8E8E93" stroke-width="1.5"/>
  <path d="M640 424 l8 6 -8 6" fill="none" stroke="#8E8E93" stroke-width="1.5"/>

