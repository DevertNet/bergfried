  <text x="751" y="458" font-family="Inter" font-size="10.5" fill="#3C3C43" text-anchor="middle">+  Neuer Ordner</text>
  <rect x="688" y="478" width="330" height="30" rx="6" fill="#FFFFFF" stroke="#DEDEE3"/>
  <text x="700" y="498" font-family="Inter" font-size="11" fill="#1D1D1F">neuer-ordner</text>
  <rect x="1026" y="478" width="82" height="30" rx="6" fill="#007AFF"/>
  <text x="1067" y="497" font-family="Inter" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Erstellen</text>
  <text x="688" y="527" font-family="Inter" font-size="9.5" fill="#8E8E93">Nur Ordner unter ~/work. Dateien werden nicht angezeigt; versteckte Ordner bleiben aus.</text>

  <!-- selected footer -->
  <rect x="688" y="550" width="504" height="54" rx="8" fill="#F7F7F9" stroke="#E5E5EA"/>
  <text x="702" y="570" font-family="Inter" font-size="9.5" font-weight="600" fill="#6E6E73">AUSGEWÄHLTER ORDNER</text>
  <text x="702" y="590" font-family="Inter" font-size="11" font-weight="600" fill="#1D1D1F">~/work/shopware-plugins</text>

  <text x="688" y="640" font-family="Inter" font-size="10" fill="#8E8E93">Klicke einen Ordner an, um hineinzugehen. „Diesen Ordner wählen“ übernimmt den aktuellen Ordner.</text>

  <rect x="986" y="770" width="90" height="32" rx="7" fill="#F2F2F5" stroke="#DEDEE3"/>
