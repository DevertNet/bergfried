  <text x="1169" y="164" font-family="Inter" font-size="10" fill="#3C3C43" text-anchor="middle">Zurück</text>

  <text x="688" y="196" font-family="Inter" font-size="9.5" font-weight="600" fill="#A1A1A6">ORDNER IN ~/WORK/SHOPWARE-PLUGINS</text>

