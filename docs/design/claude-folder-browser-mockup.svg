<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1280" height="900" fill="#F5F5F7"/>
  <text x="640" y="42" font-family="Inter" font-size="12" fill="#8E8E93" text-anchor="middle">Claude starten → Ordner-Browser (Durchsuchen …)</text>

  <!-- left: Start Claude sheet -->
  <g filter="url(#shadow)"><rect x="40" y="70" width="560" height="760" rx="14" fill="#FFFFFF"/></g>
  <text x="68" y="108" font-family="Inter" font-size="20" font-weight="700" fill="#1D1D1F">Claude starten</text>
  <text x="68" y="129" font-family="Inter" font-size="11.5" fill="#6E6E73">Sandbox shopware-plugins</text>

  <text x="68" y="165" font-family="Inter" font-size="12" font-weight="600" fill="#1D1D1F">Ordner wählen</text>
  <text x="68" y="183" font-family="Inter" font-size="10.5" fill="#8E8E93">Claude arbeitet direkt in diesem Ordner – ohne Git-Worktree.</text>

  <rect x="68" y="197" width="504" height="50" rx="8" fill="#EEF5FE" stroke="#B9D7FB"/>
  <circle cx="88" cy="222" r="7" fill="#007AFF"/><circle cx="88" cy="222" r="2.5" fill="#FFFFFF"/>
  <text x="106" y="219" font-family="Inter" font-size="12.5" font-weight="600" fill="#1D1D1F">main</text>
  <text x="106" y="235" font-family="Inter" font-size="10" fill="#6E6E73">~/work/main</text>
  <text x="552" y="226" font-family="Inter" font-size="9.5" fill="#0A64C8" text-anchor="end">zuletzt verwendet</text>

  <rect x="68" y="255" width="504" height="50" rx="8" fill="#FAFAFC" stroke="#E5E5EA"/>
