  <g transform="translate(704,276)" fill="none" stroke="#8E8E93" stroke-width="1.2"><path d="M0 3 a2 2 0 0 1 2 -2 h4 l2 2 h5 a2 2 0 0 1 2 2 v8 a2 2 0 0 1 -2 2 h-11 a2 2 0 0 1 -2 -2 z"/></g>
