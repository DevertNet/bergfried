    <text x="330" y="380" font-family="Inter" font-size="12" font-weight="600" fill="#1D1D1F">main</text>
    <text x="330" y="395" font-family="Inter" font-size="9.5" fill="#8E8E93">~/work/main</text>
    <text x="680" y="380" font-family="Inter" font-size="10.5" fill="#34A853">Claude läuft · Remote Control aktiv</text>
    <text x="680" y="395" font-family="Inter" font-size="9.5" fill="#8E8E93">RC-Link im ⋯-Menü</text>
