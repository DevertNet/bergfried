    <text x="294" y="202" font-family="Inter" font-size="10.5" fill="#8E8E93">VM bergfried-shopware-plugins  ·  Template r5  ·  4 CPU  ·  6 GB RAM  ·  Disk 12 GB used</text>
    <line x1="294" y1="218" x2="1194" y2="218" stroke="#EDEDF1"/>

    <!-- services -->
    <text x="294" y="244" font-family="Inter" font-size="10.5" font-weight="700" fill="#8E8E93" letter-spacing="0.5">DIENSTE</text>

    <!-- Claude card with list -->
    <rect x="294" y="256" width="900" height="300" rx="9" fill="#FAFAFC" stroke="#E5E5EA"/>
    <rect x="306" y="268" width="34" height="34" rx="8" fill="#F0E8FB"/>
    <text x="323" y="290" font-family="Inter" font-size="15" font-weight="700" fill="#8E4EC6" text-anchor="middle">C</text>
    <text x="352" y="280" font-family="Inter" font-size="12.5" font-weight="600" fill="#1D1D1F">Claude Code</text>
    <text x="352" y="297" font-family="Inter" font-size="10.5" fill="#34A853">installiert</text>
    <text x="398" y="297" font-family="Inter" font-size="10.5" fill="#8E8E93">·</text>
    <text x="408" y="297" font-family="Inter" font-size="10.5" fill="#34A853">angemeldet</text>

    <rect x="1070" y="266" width="100" height="30" rx="7" fill="#007AFF"/>
    <text x="1120" y="286" font-family="Inter" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">+  Claude</text>

    <text x="352" y="319" font-family="Inter" font-size="10" fill="#8E8E93">Läuft in dem Ordner, den du pro Sitzung auswählst – kein Git-Worktree, kein neuer Branch.</text>
    <line x1="306" y1="332" x2="1182" y2="332" stroke="#EDEDF1"/>

    <text x="306" y="352" font-family="Inter" font-size="9.5" font-weight="600" fill="#A1A1A6">ORDNER</text>
