      <path d="M0 3 a2 2 0 0 1 2 -2 h4 l2 2 h5 a2 2 0 0 1 2 2 v8 a2 2 0 0 1 -2 2 h-11 a2 2 0 0 1 -2 -2 z"/>
    </g>
    <text x="330" y="440" font-family="Inter" font-size="12" font-weight="600" fill="#1D1D1F">shopware-plugins</text>
    <text x="330" y="455" font-family="Inter" font-size="9.5" fill="#8E8E93">~/work/shopware-plugins</text>
    <text x="680" y="440" font-family="Inter" font-size="10.5" fill="#8E8E93">nicht gestartet</text>
    <rect x="976" y="424" width="94" height="24" rx="6" fill="#007AFF"/>
    <text x="1023" y="440" font-family="Inter" font-size="9.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start Claude</text>
    <rect x="1082" y="424" width="58" height="24" rx="6" fill="#F7F7F9" stroke="#E5E5EA"/>
    <text x="1111" y="440" font-family="Inter" font-size="9.5" fill="#B0B0B5" text-anchor="middle">iTerm</text>
    <text x="1160" y="440" font-family="Inter" font-size="12" fill="#6E6E73">⋯</text>

    <line x1="306" y1="472" x2="1182" y2="472" stroke="#F1F1F4"/>
    <text x="306" y="496" font-family="Inter" font-size="9.5" fill="#8E8E93">Bestehende Worktrees bleiben als Ordner erhalten – Bergfried legt keine neuen Git-Worktrees an.</text>
    <text x="306" y="511" font-family="Inter" font-size="9.5" fill="#8E8E93">Beim Entfernen eines Claude-Eintrags bleibt der Ordner erhalten; Claude wird nur gestoppt.</text>

    <!-- OpenCode card -->
    <rect x="294" y="576" width="900" height="96" rx="9" fill="#FAFAFC" stroke="#E5E5EA"/>
    <rect x="306" y="588" width="34" height="34" rx="8" fill="#E3F0FB"/>
    <text x="323" y="610" font-family="Inter" font-size="15" font-weight="700" fill="#0A84FF" text-anchor="middle">O</text>
    <text x="352" y="600" font-family="Inter" font-size="12.5" font-weight="600" fill="#1D1D1F">OpenCode</text>
    <circle cx="438" cy="596" r="3.5" fill="#34C759"/>
    <text x="447" y="600" font-family="Inter" font-size="10.5" fill="#34A853">Dienst läuft</text>
    <text x="352" y="617" font-family="Inter" font-size="10.5" fill="#34A853">installiert</text>
    <text x="398" y="617" font-family="Inter" font-size="10.5" fill="#8E8E93">·</text>
    <text x="408" y="617" font-family="Inter" font-size="10.5" fill="#34A853">angemeldet</text>
    <text x="352" y="639" font-family="Inter" font-size="10" fill="#8E8E93">Ein Dienst für die ganze Sandbox. Öffnet die Ordner als Projekte in der Desktop-App.</text>
    <rect x="1058" y="586" width="118" height="28" rx="6" fill="#007AFF"/>
    <text x="1117" y="604" font-family="Inter" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Connect desktop</text>
    <rect x="1058" y="622" width="118" height="28" rx="6" fill="#F2F2F5" stroke="#DEDEE3"/>
    <text x="1117" y="640" font-family="Inter" font-size="10.5" fill="#3C3C43" text-anchor="middle">Stop service</text>

    <!-- footer note -->
    <rect x="294" y="690" width="900" height="58" rx="9" fill="#F7F7F9" stroke="#E5E5EA"/>
    <text x="310" y="710" font-family="Inter" font-size="10.5" font-weight="600" fill="#1D1D1F">Claude und OpenCode</text>
    <text x="310" y="727" font-family="Inter" font-size="10" fill="#6E6E73">Beide können denselben Ordner nutzen, aber nicht gleichzeitig an denselben Dateien. Für parallele Arbeit mehrere Claude-Einträge anlegen.</text>
    <text x="310" y="741" font-family="Inter" font-size="10" fill="#6E6E73">Ein Claude-Eintrag ist nur ein Ordner mit einer Claude-Sitzung – unabhängig von Git.</text>
      <rect x="40" y="40" width="1200" height="820" fill="#000000" opacity="0.22"/>
</g>

  
