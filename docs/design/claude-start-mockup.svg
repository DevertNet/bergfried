  <text x="388" y="475" font-family="Inter" font-size="10.5" font-weight="600" fill="#6E6E73">Anderer Ordner</text>
  <rect x="388" y="485" width="392" height="30" rx="6" fill="#FFFFFF" stroke="#DEDEE3"/>
  <text x="400" y="504" font-family="Inter" font-size="11" fill="#A1A1A6">~/work/…</text>
  <rect x="790" y="485" width="102" height="30" rx="6" fill="#F2F2F5" stroke="#DEDEE3"/>
  <text x="841" y="504" font-family="Inter" font-size="10.5" fill="#3C3C43" text-anchor="middle">Durchsuchen …</text>

  <rect x="388" y="535" width="504" height="72" rx="8" fill="#F7F7F9" stroke="#E5E5EA"/>
  <text x="402" y="555" font-family="Inter" font-size="10.5" font-weight="600" fill="#1D1D1F">Was passiert beim Start?</text>
  <text x="402" y="572" font-family="Inter" font-size="10" fill="#6E6E73">Claude wechselt in diesen Ordner und setzt die letzte Sitzung fort, wenn es eine gibt.</text>
  <text x="402" y="586" font-family="Inter" font-size="10" fill="#6E6E73">Es wird kein Git-Worktree und kein neuer Branch angelegt.</text>
  <text x="402" y="600" font-family="Inter" font-size="10" fill="#6E6E73">Der Ordner bleibt beim Entfernen des Claude-Eintrags erhalten.</text>

  <rect x="698" y="645" width="92" height="32" rx="7" fill="#F2F2F5" stroke="#DEDEE3"/>
  <text x="744" y="665" font-family="Inter" font-size="11.5" fill="#3C3C43" text-anchor="middle">Abbrechen</text>
  <rect x="798" y="645" width="94" height="32" rx="7" fill="#007AFF"/>
  <text x="845" y="665" font-family="Inter" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Claude starten</text>
<text x="640" y="884" font-family="Inter" font-size="11" fill="#8E8E93" text-anchor="middle">UI-Konzept – Ordner für eine Claude-Sitzung auswählen</text>
