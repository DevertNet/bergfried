    <rect x="806" y="156" width="54" height="28" rx="7" fill="#F2F2F5" stroke="#DEDEE3"/>
    <text x="833" y="174" font-family="Inter" font-size="11.5" fill="#3C3C43" text-anchor="middle">Stop</text>
