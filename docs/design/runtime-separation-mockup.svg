    <text x="278" y="112" font-family="Inter" font-size="26" font-weight="700" fill="#1D1D1F">Sandboxes</text>
    <rect x="1062" y="86" width="148" height="34" rx="8" fill="#007AFF"/>
    <text x="1136" y="108" font-family="Inter" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">+  New sandbox</text>

