    <rect x="278" y="140" width="932" height="640" rx="12" fill="#FFFFFF" stroke="#E2E2E7"/>
    <circle cx="304" cy="170" r="5" fill="#34C759"/>
    <text x="318" y="176" font-family="Inter" font-size="16" font-weight="700" fill="#1D1D1F">shop</text>
    <text x="362" y="176" font-family="Inter" font-size="11.5" fill="#6E6E73">Running</text>
    <rect x="830" y="156" width="54" height="28" rx="7" fill="#F2F2F5" stroke="#DEDEE3"/>
    <text x="857" y="174" font-family="Inter" font-size="11.5" fill="#3C3C43" text-anchor="middle">Stop</text>
    <rect x="890" y="156" width="88" height="28" rx="7" fill="#F2F2F5" stroke="#DEDEE3"/>
    <text x="934" y="174" font-family="Inter" font-size="11.5" fill="#3C3C43" text-anchor="middle">Worktree +</text>
    <rect x="984" y="156" width="98" height="28" rx="7" fill="#F2F2F5" stroke="#DEDEE3"/>
    <text x="1033" y="174" font-family="Inter" font-size="11.5" fill="#3C3C43" text-anchor="middle">Shell / SSH</text>
    <text x="1108" y="176" font-family="Inter" font-size="14" fill="#FF3B30">⌫</text>

    <text x="294" y="202" font-family="Inter" font-size="10.5" fill="#8E8E93">VM bergfried-shop  ·  Template r5  ·  4 CPU  ·  6 GB RAM  ·  Disk 12 GB used</text>

    <line x1="294" y1="218" x2="1194" y2="218" stroke="#EDEDF1"/>

    <!-- runtimes -->
    <text x="294" y="244" font-family="Inter" font-size="10.5" font-weight="700" fill="#8E8E93" letter-spacing="0.5">RUNTIMES</text>

    <!-- claude card -->
    <rect x="294" y="256" width="438" height="96" rx="9" fill="#FAFAFC" stroke="#E5E5EA"/>
    <rect x="306" y="268" width="34" height="34" rx="8" fill="#F0E8FB"/>
    <text x="323" y="290" font-family="Inter" font-size="15" font-weight="700" fill="#8E4EC6" text-anchor="middle">C</text>
    <text x="352" y="280" font-family="Inter" font-size="12.5" font-weight="600" fill="#1D1D1F">Claude Code</text>
    <text x="352" y="297" font-family="Inter" font-size="10.5" fill="#34A853">installed</text>
    <text x="398" y="297" font-family="Inter" font-size="10.5" fill="#8E8E93">·</text>
    <text x="408" y="297" font-family="Inter" font-size="10.5" fill="#34A853">signed in</text>
    <text x="352" y="320" font-family="Inter" font-size="10" fill="#8E8E93">Runs per worktree. Start it in the worktree list below.</text>
    <text x="352" y="335" font-family="Inter" font-size="10" fill="#8E8E93">Remote Control is available for every running Claude.</text>

    <!-- opencode card -->
    <rect x="744" y="256" width="450" height="96" rx="9" fill="#FAFAFC" stroke="#E5E5EA"/>
    <rect x="756" y="268" width="34" height="34" rx="8" fill="#E3F0FB"/>
    <text x="773" y="290" font-family="Inter" font-size="15" font-weight="700" fill="#0A84FF" text-anchor="middle">O</text>
    <text x="802" y="280" font-family="Inter" font-size="12.5" font-weight="600" fill="#1D1D1F">OpenCode</text>
    <circle cx="884" cy="276" r="3.5" fill="#34C759"/>
    <text x="893" y="280" font-family="Inter" font-size="10.5" fill="#34A853">service running</text>
    <text x="802" y="297" font-family="Inter" font-size="10.5" fill="#34A853">installed</text>
    <text x="848" y="297" font-family="Inter" font-size="10.5" fill="#8E8E93">·</text>
    <text x="858" y="297" font-family="Inter" font-size="10.5" fill="#34A853">signed in</text>
    <text x="802" y="320" font-family="Inter" font-size="10" fill="#8E8E93">One service for the whole sandbox.</text>
    <text x="802" y="335" font-family="Inter" font-size="10" fill="#8E8E93">Sessions live in the desktop app.</text>
    <rect x="1078" y="310" width="100" height="26" rx="6" fill="#F2F2F5" stroke="#DEDEE3"/>
    <text x="1128" y="327" font-family="Inter" font-size="10.5" fill="#3C3C43" text-anchor="middle">Stop service</text>
    <rect x="1060" y="270" width="118" height="26" rx="6" fill="#007AFF"/>
    <text x="1119" y="287" font-family="Inter" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Connect desktop</text>

    <line x1="294" y1="372" x2="1194" y2="372" stroke="#EDEDF1"/>

    <!-- worktrees -->
    <text x="294" y="398" font-family="Inter" font-size="10.5" font-weight="700" fill="#8E8E93" letter-spacing="0.5">WORKTREES</text>
    <text x="380" y="398" font-family="Inter" font-size="10.5" fill="#8E8E93">2</text>
    <text x="294" y="418" font-family="Inter" font-size="10" fill="#8E8E93">A worktree is a folder with code. OpenCode opens these folders as projects.</text>

    <text x="294" y="448" font-family="Inter" font-size="9.5" font-weight="600" fill="#A1A1A6">WORKTREE</text>
    <text x="560" y="448" font-family="Inter" font-size="9.5" font-weight="600" fill="#A1A1A6">CLAUDE</text>
    <text x="1082" y="448" font-family="Inter" font-size="9.5" font-weight="600" fill="#A1A1A6" text-anchor="end">ACTIONS</text>
    <line x1="294" y1="458" x2="1194" y2="458" stroke="#EDEDF1"/>

    <!-- row main -->
    <circle cx="300" cy="484" r="4" fill="#34C759"/>
    <text x="312" y="488" font-family="Inter" font-size="12.5" font-weight="600" fill="#1D1D1F">main</text>
    <text x="312" y="503" font-family="Inter" font-size="10" fill="#8E8E93">~/work/main</text>
    <text x="560" y="488" font-family="Inter" font-size="11" fill="#34A853">Claude runs · Remote Control active</text>
    <text x="560" y="503" font-family="Inter" font-size="10" fill="#8E8E93">RC link in the ⋯ menu</text>
    <rect x="1030" y="474" width="66" height="24" rx="6" fill="#F2F2F5" stroke="#DEDEE3"/>
    <text x="1063" y="490" font-family="Inter" font-size="10" fill="#3C3C43" text-anchor="middle">iTerm</text>
    <text x="1176" y="490" font-family="Inter" font-size="13" fill="#6E6E73">⋯</text>
    <line x1="294" y1="518" x2="1194" y2="518" stroke="#F1F1F4"/>

    <!-- row oc -->
    <circle cx="300" cy="548" r="4" fill="#C7C7CC"/>
    <text x="312" y="552" font-family="Inter" font-size="12.5" font-weight="600" fill="#1D1D1F">oc</text>
    <text x="312" y="567" font-family="Inter" font-size="10" fill="#8E8E93">~/work/oc</text>
    <text x="560" y="552" font-family="Inter" font-size="11" fill="#8E8E93">not started</text>
    <rect x="980" y="538" width="100" height="24" rx="6" fill="#007AFF"/>
    <text x="1030" y="554" font-family="Inter" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start Claude</text>
    <rect x="1088" y="538" width="60" height="24" rx="6" fill="#F2F2F5" stroke="#DEDEE3"/>
    <text x="1118" y="554" font-family="Inter" font-size="10" fill="#3C3C43" text-anchor="middle">iTerm</text>
    <text x="1176" y="554" font-family="Inter" font-size="13" fill="#6E6E73">⋯</text>

    <rect x="294" y="600" width="900" height="54" rx="9" fill="#F7F7F9" stroke="#E5E5EA"/>
    <text x="310" y="620" font-family="Inter" font-size="11" font-weight="600" fill="#1D1D1F">How to think about it</text>
    <text x="310" y="636" font-family="Inter" font-size="10.5" fill="#6E6E73">Worktree = folder with code.  ·  Claude = one helper per worktree (start where you need it).</text>
    <text x="310" y="652" font-family="Inter" font-size="10.5" fill="#6E6E73">OpenCode = one service for the whole sandbox (start/stop once, connect the desktop app).</text>

    <text x="294" y="690" font-family="Inter" font-size="10.5" fill="#8E8E93">Claude and OpenCode can use the same worktree, but not at the same time on the same files.</text>
    <text x="294" y="708" font-family="Inter" font-size="10.5" fill="#8E8E93">Use separate worktrees for parallel work.</text>
    <text x="294" y="740" font-family="Inter" font-size="10.5" fill="#8E8E93">OpenCode sessions and permissions are managed in the desktop app.</text>
  </g>

  <text x="640" y="884" font-family="Inter" font-size="11" fill="#8E8E93" text-anchor="middle">UI concept – worktrees, Claude per worktree, OpenCode as one sandbox service</text>
  <rect x="0" y="0" width="1280" height="34" fill="#FF3B30" opacity="0.92"/>
  <text x="640" y="22" font-family="Inter" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">OUTDATED – see claude-sessions-mockup.png (Claude folders, no new git worktrees)</text>
</svg>
