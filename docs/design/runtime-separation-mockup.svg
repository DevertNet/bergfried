<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <defs>
    <clipPath id="win"><rect x="40" y="40" width="1200" height="820" rx="18"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1280" height="900" fill="#F5F5F7"/>
  <g filter="url(#shadow)"><rect x="40" y="40" width="1200" height="820" rx="18" fill="#FFFFFF"/></g>

  <g clip-path="url(#win)">
    <rect x="40" y="40" width="210" height="820" fill="#ECECEE"/>
    <line x1="250" y1="40" x2="250" y2="860" stroke="#DCDCE0"/>

    <circle cx="66" cy="66" r="6" fill="#FF5F57"/>
    <circle cx="86" cy="66" r="6" fill="#FEBC2E"/>
    <circle cx="106" cy="66" r="6" fill="#28C840"/>

    <path d="M70 112 l10 -6 10 6 v9 c0 7 -5 12 -10 15 c-5 -3 -10 -8 -10 -15 z" fill="#007AFF"/>
    <text x="98" y="126" font-family="Inter" font-size="15" font-weight="700" fill="#1D1D1F">Bergfried</text>

    <rect x="54" y="158" width="182" height="34" rx="8" fill="#DCE8FA"/>
