<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <defs>
    <clipPath id="win"><rect x="40" y="40" width="1200" height="820" rx="18"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1280" height="900" fill="#F5F5F7"/>
  <g filter="url(#shadow)">
    <rect x="40" y="40" width="1200" height="820" rx="18" fill="#FFFFFF"/>
  </g>

  <g clip-path="url(#win)">
    <!-- app sidebar -->
    <rect x="40" y="40" width="210" height="820" fill="#ECECEE"/>
    <line x1="250" y1="40" x2="250" y2="860" stroke="#DCDCE0"/>

    <circle cx="66" cy="66" r="6" fill="#FF5F57"/>
    <circle cx="86" cy="66" r="6" fill="#FEBC2E"/>
    <circle cx="106" cy="66" r="6" fill="#28C840"/>

    <path d="M70 112 l10 -6 10 6 v9 c0 7 -5 12 -10 15 c-5 -3 -10 -8 -10 -15 z" fill="#007AFF"/>
    <text x="98" y="126" font-family="Inter" font-size="15" font-weight="700" fill="#1D1D1F">Bergfried</text>

    <text x="76" y="180" font-family="Inter" font-size="13" fill="#3C3C43">Sandboxes</text>
    <text x="76" y="218" font-family="Inter" font-size="13" fill="#3C3C43">Requests</text>
    <rect x="196" y="205" width="22" height="18" rx="9" fill="#FF3B30"/>
    <text x="207" y="218" font-family="Inter" font-size="10.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="76" y="256" font-family="Inter" font-size="13" fill="#3C3C43">Audit log</text>
    <text x="76" y="294" font-family="Inter" font-size="13" fill="#3C3C43">Diagnostics</text>
    <rect x="54" y="310" width="182" height="34" rx="8" fill="#DCE8FA"/>
    <text x="76" y="332" font-family="Inter" font-size="13" font-weight="600" fill="#0A64C8">Settings</text>

    <circle cx="68" cy="788" r="4" fill="#34C759"/>
    <text x="80" y="792" font-family="Inter" font-size="11" fill="#6E6E73">Daemon running</text>
    <text x="80" y="810" font-family="Inter" font-size="10.5" fill="#8E8E93">v0.2.1-dev.27</text>

    <!-- settings sub-sidebar -->
    <rect x="250" y="40" width="200" height="820" fill="#F7F7F9"/>
    <line x1="450" y1="40" x2="450" y2="860" stroke="#E3E3E8"/>

    <text x="270" y="158" font-family="Inter" font-size="12.5" fill="#3C3C43">General</text>
    <rect x="262" y="176" width="176" height="32" rx="8" fill="#DCE8FA"/>
    <text x="278" y="197" font-family="Inter" font-size="12.5" font-weight="600" fill="#0A64C8">Updates</text>
    <text x="270" y="234" font-family="Inter" font-size="12.5" fill="#3C3C43">Base VM</text>
    <text x="270" y="272" font-family="Inter" font-size="12.5" fill="#3C3C43">Notifications</text>
    <text x="270" y="310" font-family="Inter" font-size="12.5" fill="#3C3C43">Files &amp; index</text>
    <text x="270" y="348" font-family="Inter" font-size="12.5" fill="#3C3C43">Terminal</text>
    <text x="270" y="386" font-family="Inter" font-size="12.5" fill="#3C3C43">Advanced</text>

    <text x="270" y="800" font-family="Inter" font-size="10.5" fill="#8E8E93">Version 0.2.1-dev.27</text>

    <!-- content -->
    <text x="476" y="112" font-family="Inter" font-size="26" font-weight="700" fill="#1D1D1F">Updates</text>
    <text x="476" y="132" font-family="Inter" font-size="11.5" fill="#8E8E93">Version, channel and available releases</text>

    <!-- status chips -->
    <rect x="476" y="150" width="170" height="26" rx="13" fill="#E7F7EB"/>
    <circle cx="492" cy="163" r="4" fill="#34C759"/>
    <text x="502" y="167" font-family="Inter" font-size="10.5" fill="#1E7A34">Daemon running</text>
    <rect x="656" y="150" width="112" height="26" rx="13" fill="#F2F2F5"/>
    <text x="712" y="167" font-family="Inter" font-size="10.5" fill="#6E6E73" text-anchor="middle">Index ready</text>
    <rect x="778" y="150" width="124" height="26" rx="13" fill="#F2F2F5"/>
    <text x="840" y="167" font-family="Inter" font-size="10.5" fill="#6E6E73" text-anchor="middle">Base VM built</text>

    <!-- card: version -->
    <rect x="476" y="192" width="724" height="104" rx="11" fill="#FFFFFF" stroke="#E2E2E7"/>
    <text x="494" y="218" font-family="Inter" font-size="12.5" font-weight="700" fill="#1D1D1F">Version</text>
    <text x="494" y="242" font-family="Inter" font-size="11" fill="#8E8E93">Installed</text>
    <text x="556" y="242" font-family="Inter" font-size="11.5" font-weight="600" fill="#1D1D1F">0.2.1-dev.27</text>
    <text x="494" y="266" font-family="Inter" font-size="11" fill="#8E8E93">Channel</text>
    <rect x="556" y="252" width="76" height="24" rx="6" fill="#F2F2F5" stroke="#DEDEE3"/>
    <text x="594" y="268" font-family="Inter" font-size="10.5" fill="#3C3C43" text-anchor="middle">Stable</text>
    <rect x="636" y="252" width="60" height="24" rx="6" fill="#007AFF"/>
    <text x="666" y="268" font-family="Inter" font-size="10.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Dev</text>
    <text x="712" y="268" font-family="Inter" font-size="10" fill="#8E8E93">Dev builds may be broken; stable releases are reviewed.</text>

    <!-- card: available update -->
    <rect x="476" y="312" width="724" height="238" rx="11" fill="#FFFFFF" stroke="#E2E2E7"/>
    <rect x="494" y="332" width="58" height="24" rx="12" fill="#E7F7EB"/>
    <text x="523" y="348" font-family="Inter" font-size="10" font-weight="700" fill="#1E7A34" text-anchor="middle">NEW</text>
    <text x="494" y="378" font-family="Inter" font-size="18" font-weight="700" fill="#1D1D1F">0.2.1-dev.28</text>
    <text x="494" y="400" font-family="Inter" font-size="11" fill="#8E8E93">Download size</text>
    <text x="494" y="422" font-family="Inter" font-size="20" font-weight="700" fill="#007AFF">12.4 MB</text>
    <text x="600" y="400" font-family="Inter" font-size="11" fill="#8E8E93">Published</text>
    <text x="600" y="420" font-family="Inter" font-size="11.5" fill="#1D1D1F">today, 12:40</text>

    <rect x="494" y="438" width="688" height="48" rx="7" fill="#FAFAFC" stroke="#EDEDF1"/>
    <text x="506" y="456" font-family="Inter" font-size="10.5" fill="#3C3C43">• Smaller release binaries (stripped Go helpers)</text>
    <text x="506" y="472" font-family="Inter" font-size="10.5" fill="#3C3C43">• OpenCode pairing uses a dedicated port; visible Connect button</text>

    <rect x="494" y="500" width="92" height="30" rx="7" fill="#F2F2F5" stroke="#DEDEE3"/>
    <text x="540" y="520" font-family="Inter" font-size="11.5" fill="#3C3C43" text-anchor="middle">Check now</text>
    <rect x="596" y="500" width="162" height="30" rx="7" fill="#007AFF"/>
    <text x="677" y="520" font-family="Inter" font-size="11.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Install and restart</text>
    <text x="770" y="520" font-family="Inter" font-size="10" fill="#8E8E93">Checksum verified · app and daemon restart</text>

    <!-- card: rollback -->
    <rect x="476" y="566" width="724" height="118" rx="11" fill="#FFFFFF" stroke="#E2E2E7"/>
    <text x="494" y="592" font-family="Inter" font-size="12.5" font-weight="700" fill="#1D1D1F">Rollback</text>
    <text x="494" y="614" font-family="Inter" font-size="11" fill="#6E6E73">If an update breaks Bergfried, restore the previous version:</text>
    <rect x="494" y="626" width="660" height="34" rx="7" fill="#F7F7F9" stroke="#E5E5EA"/>
    <text x="506" y="648" font-family="Menlo, monospace" font-size="10" fill="#3C3C43">~/Applications/Bergfried.app/Contents/Resources/bergfriedd update rollback</text>
    <rect x="1160" y="631" width="42" height="24" rx="6" fill="#F2F2F5" stroke="#DEDEE3"/>
    <text x="1181" y="647" font-family="Inter" font-size="10" fill="#3C3C43" text-anchor="middle">Copy</text>

    <!-- card: checks + security -->
    <rect x="476" y="700" width="724" height="116" rx="11" fill="#FFFFFF" stroke="#E2E2E7"/>
    <text x="494" y="726" font-family="Inter" font-size="12.5" font-weight="700" fill="#1D1D1F">Automatic checks</text>
    <rect x="494" y="738" width="32" height="18" rx="9" fill="#34C759"/>
    <circle cx="518" cy="747" r="7" fill="#FFFFFF"/>
    <text x="536" y="751" font-family="Inter" font-size="11" fill="#3C3C43">Check for updates automatically</text>
    <text x="494" y="776" font-family="Inter" font-size="10.5" fill="#8E8E93">Last checked: today, 12:40 · next check in about 6 hours</text>
    <text x="494" y="798" font-family="Inter" font-size="10" fill="#FF9500">Releases are not signed. The download is only checked against its SHA-256 checksum.</text>
  </g>

  <text x="640" y="884" font-family="Inter" font-size="11" fill="#8E8E93" text-anchor="middle">UI overview – settings (demo data)</text>
</svg>
